name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend Application
        run: npm run build:client
        env:
          VITE_BASE_PATH: /codex-security/
          VITE_SUPABASE_URL: https://rxyxenrcccxbshcnkygf.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ4eXhlbnJjY2N4YnNoY25reWdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNjgxNTMsImV4cCI6MjEwNjg0NDE1M30.Zc4Fg7gq0SiKC4sCJTUXW593ZGUuGmGL0GT54nzq55c
          VITE_API_BASE_URL: https://codex-security-api.onrender.com

      - name: Prepare SPA Routing Fallback
        run: |
          cp client/dist/index.html client/dist/404.html
          cp client/dist/index.html client/dist/200.html
          touch client/dist/.nojekyll

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'client/dist'
        continue-on-error: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Deploy to gh-pages branch (Dual Fallback)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: client/dist
          branch: gh-pages
